[project]
name = "three-line-trader"
version = "0.1.0"
description = "국내주식 3선 자동매매"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "matplotlib>=3.11.1",
    "pillow>=11.0",
    "pystray>=0.19.5",
    "reportlab>=4.4",
    "requests>=2.34.2",
    "tkcalendar>=1.6.1",
    "websockets>=16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "font: 한글 폰트가 없는 환경에서도 돌아야 하는 시험",
]
pythonpath = ["."]
testpaths = ["tests"]